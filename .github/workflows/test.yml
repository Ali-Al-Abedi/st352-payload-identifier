# VPID self-test — runs on every push and pull request.
#
# Extracts the JavaScript bundle from vpid.html and runs the full
# round-trip + smoke + import-flow test suite. A failure here blocks
# merging changes that would silently regress the audit.

name: VPID self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract JS bundle from vpid.html
        run: python3 tests/extract_vpid_js.py

      - name: Run VPID self-test (round-trip + smoke + importer)
        run: node /tmp/vpid_test.js
